name: Live app check

# Streamlit Community Cloud redeploys automatically on every push to main --
# that is the CD. What it does NOT tell you is whether the result is actually
# reachable, or whether the app has gone to sleep through inactivity.
#
# This closes that gap: it pings the live URL, and in the week before the
# session it runs daily so a broken deployment surfaces early rather than at
# 12:30 in front of an auditorium.

on:
  workflow_dispatch:
  schedule:
    # 06:30 UTC = 12:00 IST, daily. Adjust or remove after the session.
    - cron: "30 6 * * *"

jobs:
  reachable:
    name: Is the live app up?
    runs-on: ubuntu-latest
    steps:
      - name: Check the app responds
        env:
          APP_URL: ${{ vars.STREAMLIT_APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::notice::STREAMLIT_APP_URL is not set yet."
            echo "Set it once the app is deployed:"
            echo "  gh variable set STREAMLIT_APP_URL --body 'https://your-app.streamlit.app'"
            exit 0
          fi

          # Hit /healthz, NOT the app root. The root 303-redirects into a loop
          # that curl cannot resolve (it needs a browser), so following it just
          # burns 50 redirects and exits 47. /healthz returns plain JSON.
          health="${APP_URL%/}/healthz"
          echo "Checking $health"

          # `set -e` is on, so a failing curl would kill the step before we can
          # report anything useful. Capture status and exit code separately.
          set +e
          code=$(curl -sS --max-time 45 -o /tmp/body -w '%{http_code}' "$health")
          rc=$?
          set -e

          echo "curl exit=$rc  HTTP=$code"
          echo "body: $(head -c 200 /tmp/body)"

          if [ "$rc" -ne 0 ]; then
            echo "::error::curl failed (exit $rc) — host unreachable or timed out."
            exit 1
          fi

          if [ "$code" != "200" ] || ! grep -q '"status":"ok"' /tmp/body; then
            echo "::error::App is not healthy (HTTP $code). It may be broken or removed."
            exit 1
          fi

          echo "App is reachable and reporting healthy."
          echo
          echo "Note: this proves the host is serving the app. It does NOT prove the"
          echo "app is awake, in LIVE mode, or that GuideBot still refuses correctly."
          echo "For that, run:  python tools/check_live_app.py"
